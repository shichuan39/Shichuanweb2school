<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>chuan</title>

    <!---诗川3D Model 展示器--->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
   
    <!---诗川css资源库模版3--->
<style>
   
     nav {
      display: flex;
      justify-content: center;
      margin-left: 20px;
      gap: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(40px);
      border-radius: 21px;
      width: 370px;
      box-shadow: 1px 8px 32px rgba(0, 0, 0, 0.1);
    }

    nav button {
      background: none;
      border: none;
      color: rgb(17, 17, 17);
      font-size: 18px;
      cursor: pointer;
      padding: 8px 20px;
      border-radius: 16px;
      transition: all 0.7s cubic-bezier(.24,.34,0,1.44);
      font-family: inherit;
    }

    nav button:hover {
      background: rgba(255, 255, 255, 0.021);
    }

    nav button.active {
      background: rgba(0, 0, 0, 0.096);
      color: #ff0000;
      transform: scale(1.1);
    }

    .page {
      display: none;          
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 1s;
    }

    .page.active {
      display: block;         
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
</style>

<!---rest van de css--->
<style>
   
 .project-item1{
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 21px;
        box-shadow: 1px 8px 32px rgba(0, 0, 0, 0.1);
        gap: 30px;
        padding: 15px 31px;
        display: flex;
    }
    .project-item2{
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 21px;
        width: 346px;
        box-shadow: 1px 8px 32px rgba(0, 0, 0, 0.1);
        gap: 30px;
        padding: 15px 31px;
        margin-left: 20px;
        display: flex;
    
    }
     body {
        background: linear-gradient(to right, #ffffff, #ffffff, #ffffff, #ffffff, #ffffff, #00000018, #0000007a);
       
    }
   

    </style>



 <!---enable structuur voor mobiel en tablet--->
    <style>
@media (max-width: 768px) {
   nav {
      display: flex;
      justify-content: left;
      gap: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(40px);
      border-radius: 21px;
      box-shadow: 1px 8px 32px rgba(0, 0, 0, 0.1);
    }
 
}
    </style>

  <nav>
    <div>
    <button class="active" onclick="showPage('home', this)">Home</button>
    <button onclick="showPage('about', this)">About</button>
    <button onclick="showPage('contact', this)">Contact</button>
    </div>
  </nav>
</head>
 







<body>

    <div>
    
        <!-- 卡片 -->
        <div class="project-item2" style="margin-top: 20px;"> IRad phone</div>

       
        <div class="page active" id="home">
            <h1 style="text-align: center; margin: center; scale: 1.2;">Welcome</h1>
            <p style="background-color: rgb(56, 109, 255); border-radius: 35px; padding: 10px; width: 90px; color: white;">shop</p>
             <!--3D -->
    <div  style=" scale:0.6;">
        
        <!-- glb model -->
        <model-viewer 
            src="glbmodel/ITphone RAd1.glb" 
            alt="iRad phone 3D 模型" 
            auto-rotate
            rotation-per-second="60deg"
            shadow-intensity="1"
            style="width: 100%; height: 80vh; border-radius: 45px; ">
        </model-viewer>
   </div>
        </div>

        <div class="page" id="about">
            <p style="text-align: left; margin-left: 20px;">About Us</p >
        </div>

        <div class="page" id="contact">
            <p style="text-align: left; margin-left: 20px;">Contact Us</p >
            <p style="text-align: left; margin-left: 20px;">TYZShichuan & Fabian</p >
        </div>
    </div>


   

</body>








<!---javascript AI--->
<script>
     function showPage(id, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
</script>
</html>
