<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iRad Phone</title>

    <!-- 3D model viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
   

    <!-- css apple style glassshape，button -->
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
    
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1d1d1f;
            min-height: 100vh;
        }
        
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav button {
            background: none;
            border: none;
            color: #1d1d1f;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 16px;
            transition: all 0.5s cubic-bezier(.24,.34,0,1.44);
        }

        nav button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        nav button.active {
            background: rgba(0, 0, 0, 0.1);
            color: #0071e3; 
            transform: scale(1.05);
        }

    
        .page {
            display: none;          
            padding: 60px 20px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .page.active {
            display: block;         
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* --- structuur --- */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 22px;
            color: #86868b;
            margin-bottom: 30px;
        }

  
        .button-group {
            display: flex;
            gap: 20px;
            margin-bottom: 40px; 
        }

        .apple-btn {
            padding: 14px 32px;
            border-radius: 999px; 
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 1s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: inherit;
        }

        .apple-btn:hover {
            transform: scale(1.04); 
            opacity: 0.9;
        }

        .apple-btn:active {
            transform: scale(0.97); 
        }

        /* (Shop) */
        .btn-primary {
            background-color: #0071e3;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        /* (Learn More) */
        .btn-secondary {
            background-color: transparent;
            color: #0071e3;
            border: 1px solid #0071e3;
        }

        .btn-secondary:hover {
            background-color: rgba(0, 113, 227, 0.05);
        }

  
        model-viewer {
            width: 100%;
            max-width: 800px;
            height: 50vh; 
            background-color: transparent;
            border-radius: 45px;
            transition: transform 0.5s cubic-bezier(.24,.34,0,1.44);
        }

      
        model-viewer:hover {
            transform: scale(1.03);
        }

        
        .glass-box {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: inline-block;
        }

        /* 手机端适配AI */
        @media (max-width: 768px) {
            .hero-title { font-size: 40px; }
            .hero-subtitle { font-size: 18px; }
            .button-group { flex-direction: column; gap: 15px; } 
            model-viewer { height: 50vh; }
        }
    </style>
</head>

<body>

    <!-- 导航栏 -->
     <div>
    <nav>
       <img src="picture/RC logo标志.png" alt="Logo" style="width: 30px;">
        <button class="active" onclick="showPage('home', this)">Home</button>
        <button onclick="showPage('IRad', this)">IRad</button>
        <button onclick="showPage('System', this)">System</button>
        <button onclick="showPage('Support', this)">Support</button>
    </nav>
    
    </div>

    <!-- 首页 Home -->
    <div class="page active" id="home">
        <div class="hero-section">
            <h1 class="hero-title">Welcome</h1>
            <p class="hero-subtitle">Meet the most powerful iRad lineup ever.</p >

            <!-- Shop 和 Learn More button -->
            <div class="button-group">
                <button class="apple-btn btn-primary" onclick="showPage('shop', this)">Shop</button>
                <button class="apple-btn btn-secondary" onclick="alert('More info coming soon!')">Learn more</button>
            </div>

            <!-- 3D viewer inhoud -->
            <model-viewer 
                src="glbmodel/ITphone RAd2.glb" 
                alt="iRad phone 3D 模型" 
                auto-rotate
                rotation-per-second="40deg"
                shadow-intensity="1"
              >
            </model-viewer>
        </div>
        <div style="margin-top: 100px;">
        <img src="picture/IOS67.png" alt="IOS67" style="width: 70px; max-width: 100px; margin-top: 20px; border-radius: 20px;">
        <img src="picture/耳机1_1.png" alt="耳机1" style="width: 125px; max-width: 125px; margin-bottom: -10px; border-radius: 24px;">
        </div>
        <p style="margin-top: 100px; color: #86868b;">Privacy Policy</p>
    </div>

    <!-- IRad 页面 -->
    <div class="page" id="IRad">
        <h1 class="hero-title">IRad</h1>
        <p class="hero-subtitle">Discover the new generation.</p >
    </div>

    <div class="page" id="System">
       
    </div>

    <!-- Support 页面 -->
    <div class="page" id="Support">
        <div class="glass-box">
            <h2 style="margin-bottom: 20px;">Contact Us</h2>
            <p style="font-size: 18px;">Tongyu</p >
            <p style="font-size: 18px;">Fabian</p >
        </div>
       
    </div>

    <!-- Javascript AI -->
    <script>
        function showPage(id, btn) {
            // 如果要跳转的页面不存在，就不跳转（比如你还没写商店页面）
            if(!document.getElementById(id)) return; 
            
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(btn.closest('nav')) {
                btn.classList.add('active');
            }
        }
    </script>
</body>
</html>
